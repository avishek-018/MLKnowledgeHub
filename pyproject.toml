[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-knowledge-hub"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.64,<2",
    "openai>=3.13",
    "qdrant-client>=1.19",
    "neo4j>=6.3",
    "sentence-transformers>=6.0",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "pymupdf>=1.28",
    "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
